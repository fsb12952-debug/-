<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тир - Стрельба по мишеням</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
            user-select: none;
        }

        /* Custom Crosshair Cursor for Canvas */
        .crosshair-cursor {
            cursor: crosshair;
        }

        /* Target Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .animated-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }

        .screen-shake {
            animation: shake 0.15s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-white flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden select-none">

    <!-- Header & Game Stats -->
    <div id="game-container" class="w-full max-w-4xl flex flex-col items-center">
    <div class="w-full bg-slate-900/90 backdrop-blur-md rounded-2xl p-3 sm:p-4 mb-3 border border-slate-800 shadow-2xl flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-3">
            <div id="map-badge-icon" class="bg-emerald-600 p-2 sm:p-2.5 rounded-xl text-xl sm:text-2xl shadow-lg shadow-emerald-500/30">
                🌲
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-wide bg-gradient-to-r from-amber-400 via-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                    Тир: Мастер Стрельбы
                </h1>
                <p id="map-badge-title" class="text-xs text-slate-400">Локация: Лес</p>
            </div>
        </div>

        <!-- Dynamic Game Metrics -->
    <div class="flex items-center gap-2 sm:gap-4 text-center">
        <div class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
            <div class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-wider">Баланс</div>
            <div id="money-display" class="text-base sm:text-xl font-black text-amber-400">$0</div>
        </div>
        <div class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
            <div class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-wider">Счет</div>
            <div id="score" class="text-base sm:text-xl font-black text-emerald-400">0</div>
        </div>
        <div class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
            <div class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-wider">Точность</div>
            <div id="accuracy" class="text-base sm:text-xl font-black text-cyan-400">100%</div>
        </div>
        <div class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
            <div class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-wider">Время</div>
            <div id="timer" class="text-base sm:text-xl font-black text-rose-400">30s</div>
        </div>
    </div>
</div>

<!-- Main Game Container -->
<div id="canvas-wrapper" class="relative w-full aspect-[4/3] sm:aspect-[16/9] bg-slate-900 rounded-2xl border-2 border-slate-800 shadow-2xl overflow-hidden flex items-center justify-center">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" class="w-full h-full crosshair-cursor block"></canvas>

    <!-- Start / Game Over / Shop Overlay Screen -->
    <div id="overlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-4 sm:p-6 text-center transition-all duration-300 z-10">
        <div class="max-w-xl w-full bg-slate-900 border border-slate-800 p-5 sm:p-7 rounded-3xl shadow-2xl relative overflow-hidden max-h-[92vh] flex flex-col">
            
            <!-- Main Header -->
            <div class="mb-4">
                <div id="overlay-icon" class="text-4xl sm:text-5xl mb-1">🎯</div>
                <h2 id="overlay-title" class="text-2xl sm:text-3xl font-extrabold text-white">Аркадный Тир</h2>
                <p id="overlay-desc" class="text-slate-400 text-xs sm:text-sm">Зарабатывайте деньги за очки и открывайте новое арсенал-оснащение!</p>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex bg-slate-800/80 p-1 rounded-xl mb-4 text-xs font-bold border border-slate-700/50">
                <button id="tab-game" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white transition-all">Игра</button>
                <button id="tab-shop" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all flex justify-center items-center gap-1.5">
                    🛒 Магазин <span id="shop-money" class="text-amber-400 font-black">$0</span>
                </button>
            </div>

            <!-- Tab 1: Game Options Panel -->
            <div id="panel-game" class="flex-1 overflow-y-auto space-y-4 pr-1">
                
                <!-- Difficulty Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 text-left">Уровень сложности:</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <button type="button" class="difficulty-btn border-2 border-indigo-500 bg-indigo-500/20 text-white p-2 rounded-xl text-left transition-all" data-level="beginner">
                            <div class="font-bold text-xs">👶 Новичок</div>
                            <div class="text-[10px] text-slate-400">Медленные мишени</div>
                        </button>
                        <button type="button" class="difficulty-btn border-2 border-slate-700 bg-slate-800 text-slate-300 p-2 rounded-xl text-left transition-all hover:border-slate-500" data-level="amateur">
                            <div class="font-bold text-xs">🎯 Любитель</div>
                            <div class="text-[10px] text-slate-400">Обычная скорость</div>
                        </button>
                        <button type="button" class="difficulty-btn border-2 border-slate-700 bg-slate-800 text-slate-300 p-2 rounded-xl text-left transition-all hover:border-slate-500" data-level="pro">
                            <div class="font-bold text-xs">⚡ Профи</div>
                            <div class="text-[10px] text-slate-400">Быстрые мишени</div>
                        </button>
                        <button type="button" class="difficulty-btn border-2 border-slate-700 bg-slate-800 text-slate-300 p-2 rounded-xl text-left transition-all hover:border-slate-500" data-level="master">
                            <div class="font-bold text-xs">🔥 Мастер</div>
                            <div class="text-[10px] text-slate-400">Хаос и малый размер</div>
                        </button>
                    </div>
                </div>

                <!-- Selected Equipment Summary -->
                <div class="grid grid-cols-2 gap-3 text-left">
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 flex items-center justify-between">
                        <div>
                            <div class="text-[10px] text-slate-400 font-semibold uppercase">Выбрано оружие</div>
                            <div id="selected-weapon-name" class="text-sm font-bold text-indigo-400">Пистолет</div>
                        </div>
                        <span id="selected-weapon-icon" class="text-2xl">🔫</span>
                    </div>
                    <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 flex items-center justify-between">
                        <div>
                            <div class="text-[10px] text-slate-400 font-semibold uppercase">Локация</div>
                            <div id="selected-map-name" class="text-sm font-bold text-emerald-400">Лес</div>
                        </div>
                        <span id="selected-map-icon" class="text-2xl">🌲</span>
                    </div>
                </div>

                <!-- Start Button -->
                <button id="start-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-600/30 text-base sm:text-lg tracking-wide transition-all transform active:scale-95">
                    🚀 НАЧАТЬ ИГРУ
                </button>
            </div>

            <!-- Tab 2: Shop Panel -->
            <div id="panel-shop" class="hidden flex-1 overflow-y-auto space-y-4 pr-1 text-left">
                <!-- Shop Subtabs -->
                <div class="flex border-b border-slate-800 pb-2 gap-4 text-xs font-bold text-slate-400">
                    <button id="shop-subtab-weapons" class="text-indigo-400 border-b-2 border-indigo-400 pb-1">Оружие</button>
                    <button id="shop-subtab-maps" class="hover:text-white pb-1">Локации</button>
                </div>

                <!-- Weapons List -->
                <div id="shop-weapons-container" class="space-y-2">
                    <!-- Dynamic rendering -->
                </div>

                <!-- Maps List -->
                <div id="shop-maps-container" class="hidden space-y-2">
                    <!-- Dynamic rendering -->
                </div>
            </div>

        </div>
    </div>
</div>
</div>

<script>
    // Game State & Configuration
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');

    // UI Elements
    const moneyDisplay = document.getElementById('money-display');
    const shopMoney = document.getElementById('shop-money');
    const scoreDisplay = document.getElementById('score');
    const accuracyDisplay = document.getElementById('accuracy');
    const timerDisplay = document.getElementById('timer');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const overlayIcon = document.getElementById('overlay-icon');
    const startBtn = document.getElementById('start-btn');

    const tabGame = document.getElementById('tab-game');
    const tabShop = document.getElementById('tab-shop');
    const panelGame = document.getElementById('panel-game');
    const panelShop = document.getElementById('panel-shop');

    const shopSubtabWeapons = document.getElementById('shop-subtab-weapons');
    const shopSubtabMaps = document.getElementById('shop-subtab-maps');
    const shopWeaponsContainer = document.getElementById('shop-weapons-container');
    const shopMapsContainer = document.getElementById('shop-maps-container');

    const selectedWeaponName = document.getElementById('selected-weapon-name');
    const selectedWeaponIcon = document.getElementById('selected-weapon-icon');
    const selectedMapName = document.getElementById('selected-map-name');
    const selectedMapIcon = document.getElementById('selected-map-icon');
    const mapBadgeTitle = document.getElementById('map-badge-title');
    const mapBadgeIcon = document.getElementById('map-badge-icon');

    // Audio Context Setup for Sound Effects
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Weapons Definitions
    const WEAPONS = {
        pistol: { id: 'pistol', name: 'Пистолет', icon: '🔫', price: 0, unlocked: true, desc: 'Классическое точное оружие' },
        shotgun: { id: 'shotgun', name: 'Дробовик', icon: '💥', price: 150, unlocked: false, desc: 'Широкая область поражения' },
        laser: { id: 'laser', name: 'Лазер', icon: '⚡', price: 300, unlocked: false, desc: 'Энергетический бластер' },
        shuriken: { id: 'shuriken', name: 'Сюрикен', icon: '🥷', price: 450, unlocked: false, desc: 'Ниндзя-звездочка с быстрым вращением' },
        kunai: { id: 'kunai', name: 'Кунай', icon: '🗡️', price: 600, unlocked: false, desc: 'Точный бросковый клинок' }
    };

    // Maps Definitions
    const MAPS = {
        forest: { id: 'forest', name: 'Лес', icon: '🌲', price: 0, unlocked: true, color: '#10b981' },
        desert: { id: 'desert', name: 'Пустыня', icon: '🏜️', price: 100, unlocked: false, color: '#f59e0b' },
        cyberpunk: { id: 'cyberpunk', name: 'Неоновый Город', icon: '🏙️', price: 250, unlocked: false, color: '#ec4899' },
        snow: { id: 'snow', name: 'Снежные Горы', icon: '🏔️', price: 400, unlocked: false, color: '#06b6d4' }
    };

    // Save/Load Data
    let playerData = {
        money: 0,
        unlockedWeapons: ['pistol'],
        unlockedMaps: ['forest'],
        equippedWeapon: 'pistol',
        equippedMap: 'forest'
    };

    function loadData() {
        try {
            const saved = localStorage.getItem('shooting_gallery_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                playerData = { ...playerData, ...parsed };
                Object.keys(WEAPONS).forEach(k => {
                    if (playerData.unlockedWeapons.includes(k)) WEAPONS[k].unlocked = true;
                });
                Object.keys(MAPS).forEach(k => {
                    if (playerData.unlockedMaps.includes(k)) MAPS[k].unlocked = true;
                });
            }
        } catch(e) {}
        updateEconomyUI();
    }

    function saveData() {
        try {
            localStorage.setItem('shooting_gallery_data', JSON.stringify(playerData));
        } catch(e) {}
    }

    function updateEconomyUI() {
        moneyDisplay.textContent = `$${playerData.money}`;
        shopMoney.textContent = `$${playerData.money}`;
        
        const w = WEAPONS[playerData.equippedWeapon];
        selectedWeaponName.textContent = w.name;
        selectedWeaponIcon.textContent = w.icon;

        const m = MAPS[playerData.equippedMap];
        selectedMapName.textContent = m.name;
        selectedMapIcon.textContent = m.icon;
        mapBadgeTitle.textContent = `Локация: ${m.name}`;
        mapBadgeIcon.textContent = m.icon;
    }

    // Play Sound FX
    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'shot_pistol') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'shot_shotgun') {
            const bufferSize = audioCtx.sampleRate * 0.25;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, now);
            filter.frequency.linearRampToValueAtTime(100, now + 0.25);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            whiteNoise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            whiteNoise.start(now);
        } else if (type === 'shot_laser') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'throw_shuriken') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(200, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'throw_kunai') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'hit_gold') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'hit') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }
    }

    // Difficulty Options
    const DIFFICULTY_SETTINGS = {
        beginner: { name: 'Новичок', duration: 4500, spawnInterval: 1200, sizeMultiplier: 1.3 },
        amateur: { name: 'Любитель', duration: 3600, spawnInterval: 950, sizeMultiplier: 1.0 },
        pro: { name: 'Профи', duration: 2800, spawnInterval: 750, sizeMultiplier: 0.8 },
        master: { name: 'Мастер', duration: 2200, spawnInterval: 550, sizeMultiplier: 0.65 }
    };
    let currentDifficulty = 'beginner';

    // Game Variables
    let isGameRunning = false;
    let score = 0;
    let totalShots = 0;
    let totalHits = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let spawnTimeout = null;
    let targets = [];
    let particles = [];
    let shockwaves = [];
    let floatingTexts = [];
    let hitmarkers = [];
    let projectiles = [];   // Flying bullets, shurikens, kunai
    let laserBeams = [];    // Visual laser beam pulses
    let muzzleFlashes = []; // Weapon muzzle flash effects
    let mousePos = { x: 0, y: 0 };
    let gunOffset = { x: 0, y: 0, angle: 0, recoil: 0 };

    // Canvas Resize Handling
    function resizeCanvas() {
        const rect = canvasWrapper.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        mousePos = { x: canvas.width / 2, y: canvas.height / 2 };
    }
    window.addEventListener('resize', resizeCanvas);

    // Target Class
    class Target {
        constructor() {
            const settings = DIFFICULTY_SETTINGS[currentDifficulty];
            this.radius = (Math.random() * 14 + 22) * settings.sizeMultiplier;
            this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
            this.y = Math.random() * (canvas.height - this.radius * 2 - 100) + this.radius + 30; // avoid extreme bottom weapon area
            this.isGold = Math.random() < 0.2; // 20% gold chance
            this.createdAt = performance.now();
            this.duration = settings.duration; 
            this.alpha = 0;
            this.scale = 0;
            this.isHit = false;
            this.stuckProjectiles = []; // Projectiles stuck in target (kunai/shuriken/bullets)
        }

        draw() {
            const elapsed = performance.now() - this.createdAt;
            const progress = elapsed / this.duration;

            if (progress >= 1 && !this.isHit) return false;

            // Fade in/out scaling
            if (this.isHit) {
                this.alpha -= 0.08;
                if (this.alpha <= 0) return false;
            } else if (elapsed < 200) {
                this.scale = elapsed / 200;
                this.alpha = this.scale;
            } else if (progress > 0.8) {
                this.alpha = (1 - progress) / 0.2;
            } else {
                this.scale = 1;
                this.alpha = 1;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);

            // Ring Outer
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.isGold ? '#f59e0b' : '#ef4444';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Ring Middle
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.65, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Ring Inner
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = this.isGold ? '#d97706' : '#dc2626';
            ctx.fill();

            // Center Bullseye Dot
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Time ring remaining indicator
            if (!this.isHit) {
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 4, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * (1 - progress)));
                ctx.strokeStyle = this.isGold ? '#fbbf24' : '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            // Draw projectiles stuck into target
            this.stuckProjectiles.forEach(p => {
                ctx.save();
                ctx.translate(p.offsetX, p.offsetY);
                ctx.rotate(p.rotation);

                if (p.type === 'shuriken') {
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        const a = (i * Math.PI) / 2;
                        ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
                        ctx.lineTo(Math.cos(a + Math.PI / 4) * 5, Math.sin(a + Math.PI / 4) * 5);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (p.type === 'kunai') {
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.moveTo(0, -14);
                    ctx.lineTo(5, -2);
                    ctx.lineTo(2, 0);
                    ctx.lineTo(2, 12);
                    ctx.lineTo(-2, 12);
                    ctx.lineTo(-2, 0);
                    ctx.lineTo(-5, -2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Bullet mark
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(0, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            ctx.restore();
            return true;
        }
    }

    // Flying Projectile Class (Bullets, Shurikens, Kunai)
    class FlyingProjectile {
        constructor(startX, startY, targetX, targetY, type, targetRef = null) {
            this.x = startX;
            this.y = startY;
            this.targetX = targetX;
            this.targetY = targetY;
            this.type = type;
            this.targetRef = targetRef;
            this.rotation = 0;
            this.active = true;

            const angle = Math.atan2(targetY - startY, targetX - startX);
            this.angle = angle;
            
            // Speed according to projectile type
            const speed = (type === 'shuriken' || type === 'kunai') ? 35 : 55;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.distanceTotal = Math.hypot(targetX - startX, targetY - startY);
            this.distanceTraveled = 0;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.distanceTraveled += Math.hypot(this.vx, this.vy);
            this.rotation += (this.type === 'shuriken') ? 0.4 : 0.05;

            // Check if reached destination
            if (this.distanceTraveled >= this.distanceTotal) {
                this.active = false;
                // If hit target, stick inside target
                if (this.targetRef) {
                    this.targetRef.stuckProjectiles.push({
                        type: this.type,
                        offsetX: this.targetX - this.targetRef.x,
                        offsetY: this.targetY - this.targetRef.y,
                        rotation: this.angle + Math.PI / 2
                    });
                }
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle + Math.PI / 2 + (this.type === 'shuriken' ? this.rotation : 0));

            if (this.type === 'shuriken') {
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const a = (i * Math.PI) / 2;
                    ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16);
                    ctx.lineTo(Math.cos(a + Math.PI / 4) * 6, Math.sin(a + Math.PI / 4) * 6);
                }
                ctx.closePath();
                ctx.fill();
            } else if (this.type === 'kunai') {
                ctx.fillStyle = '#94a3b8';
                ctx.beginPath();
                ctx.moveTo(0, -20);
                ctx.lineTo(6, -5);
                ctx.lineTo(2, -2);
                ctx.lineTo(2, 10);
                ctx.lineTo(-2, 10);
                ctx.lineTo(-2, -2);
                ctx.lineTo(-6, -5);
                ctx.closePath();
                ctx.fill();
            } else {
                // Bullet tracer
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, 15);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    // Laser Beam Effect Class
    class LaserBeam {
        constructor(startX, startY, endX, endY) {
            this.startX = startX;
            this.startY = startY;
            this.endX = endX;
            this.endY = endY;
            this.alpha = 1.0;
        }

        update() {
            this.alpha -= 0.1;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);

            // Outer Laser Glow
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 10;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            ctx.lineTo(this.endX, this.endY);
            ctx.stroke();

            // Inner Core Laser Beam
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            ctx.lineTo(this.endX, this.endY);
            ctx.stroke();

            ctx.restore();
        }
    }

    // Muzzle Flash Effect
    class MuzzleFlash {
        constructor(x, y, angle) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.alpha = 1.0;
        }

        update() {
            this.alpha -= 0.2;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    }

    // Particle Effect Class
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.radius = Math.random() * 3 + 2;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.friction = 0.94;
        }

        update() {
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.025;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    // Shockwave Effect
    class Shockwave {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.radius = 5;
            this.maxRadius = 35;
            this.color = color;
            this.alpha = 1;
        }

        update() {
            this.radius += 2.5;
            this.alpha = 1 - (this.radius / this.maxRadius);
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = this.color;
            ctx.stroke();
            ctx.restore();
        }
    }

    // Floating Text Score
    class FloatingText {
        constructor(x, y, text, color) {
            this.x = x;
            this.y = y;
            this.text = text;
            this.color = color;
            this.alpha = 1;
            this.vy = -1.5;
        }

        update() {
            this.y += this.vy;
            this.alpha -= 0.02;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.font = '900 16px Outfit, sans-serif';
            ctx.fillStyle = this.color;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    // Hitmarker Class
    class Hitmarker {
        constructor(x, y, hit = true) {
            this.x = x;
            this.y = y;
            this.hit = hit;
            this.alpha = 1;
            this.size = 8;
        }

        update() {
            this.alpha -= 0.05;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.strokeStyle = this.hit ? '#34d399' : '#f87171';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(this.x - this.size, this.y - this.size);
            ctx.lineTo(this.x + this.size, this.y + this.size);
            ctx.moveTo(this.x + this.size, this.y - this.size);
            ctx.lineTo(this.x - this.size, this.y + this.size);
            ctx.stroke();

            ctx.restore();
        }
    }

    // Draw Map Environment Background
    function drawMapBackground() {
        const mapId = playerData.equippedMap;

        if (mapId === 'forest') {
            // Forest Landscape
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#064e3b');
            grad.addColorStop(0.6, '#022c22');
            grad.addColorStop(1, '#052e16');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Hills & Trees silhouette
            ctx.fillStyle = '#065f46';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.2, canvas.height + 80, canvas.width * 0.35, 0, Math.PI * 2);
            ctx.arc(canvas.width * 0.75, canvas.height + 100, canvas.width * 0.45, 0, Math.PI * 2);
            ctx.fill();

            // Stylized Trees
            const treeCols = ['#047857', '#059669', '#10b981'];
            for (let i = 0; i < canvas.width; i += 70) {
                const h = 80 + Math.sin(i * 0.05) * 20;
                ctx.fillStyle = treeCols[i % treeCols.length];
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 30);
                ctx.lineTo(i + 30, canvas.height - 30 - h);
                ctx.lineTo(i + 60, canvas.height - 30);
                ctx.fill();
            }
        } else if (mapId === 'desert') {
            // Desert Sunset
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#7c2d12');
            grad.addColorStop(0.5, '#c2410c');
            grad.addColorStop(1, '#f59e0b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dunes
            ctx.fillStyle = '#9a3412';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.3, canvas.height + 120, canvas.width * 0.4, 0, Math.PI * 2);
            ctx.arc(canvas.width * 0.8, canvas.height + 100, canvas.width * 0.45, 0, Math.PI * 2);
            ctx.fill();
        } else if (mapId === 'cyberpunk') {
            // Neon City Grid
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(236, 72, 153, 0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        } else if (mapId === 'snow') {
            // Snow Mountains
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(0.6, '#1e293b');
            grad.addColorStop(1, '#334155');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(canvas.width * 0.25, canvas.height * 0.4);
            ctx.lineTo(canvas.width * 0.5, canvas.height);
            ctx.lineTo(canvas.width * 0.75, canvas.height * 0.35);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();
        }
    }

    // Render Equipped Weapon at Bottom Center of Screen
    function drawEquippedWeapon() {
        const weaponId = playerData.equippedWeapon;
        const originX = canvas.width / 2;
        const originY = canvas.height + 10;

        // Calculate angle towards crosshair/mouse position
        const dx = mousePos.x - originX;
        const dy = mousePos.y - originY;
        const targetAngle = Math.atan2(dy, dx);

        // Smooth recoil damping
        gunOffset.recoil *= 0.85;

        ctx.save();
        ctx.translate(originX, originY);
        // Tilt slightly towards mouse position
        ctx.rotate(targetAngle + Math.PI / 2);

        // Recoil displacement (push back when shooting)
        ctx.translate(0, gunOffset.recoil);

        if (weaponId === 'pistol') {
            // Draw Pistol Barrel & Handle
            ctx.fillStyle = '#334155';
            ctx.fillRect(-8, -60, 16, 50); // barrel
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-10, -55, 20, 20); // slide accent
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-7, -15, 14, 25); // grip
            // Red laser sight indicator
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -60);
            ctx.lineTo(0, -600);
            ctx.stroke();
        } else if (weaponId === 'shotgun') {
            // Draw Double Barrel Shotgun
            ctx.fillStyle = '#475569';
            ctx.fillRect(-14, -75, 12, 65); // left barrel
            ctx.fillRect(2, -75, 12, 65);  // right barrel
            ctx.fillStyle = '#78350f';     // wooden stock
            ctx.fillRect(-10, -15, 20, 35);
        } else if (weaponId === 'laser') {
            // Draw Sci-Fi Laser Blaster
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(-12, -70, 24, 60);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-6, -80, 12, 15); // energy tip
            ctx.shadowColor = '#0284c7';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(-4, -50, 8, 30);
        } else if (weaponId === 'shuriken') {
            // Ninja Shuriken held in hand
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const angle = (i * Math.PI) / 2;
                ctx.lineTo(Math.cos(angle) * 35, Math.sin(angle) * 35 - 30);
                ctx.lineTo(Math.cos(angle + Math.PI / 4) * 12, Math.sin(angle + Math.PI / 4) * 12 - 30);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else if (weaponId === 'kunai') {
            // Ninja Kunai Knife
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(0, -85); // sharp tip
            ctx.lineTo(12, -35);
            ctx.lineTo(4, -30);
            ctx.lineTo(4, -5);
            ctx.lineTo(-4, -5);
            ctx.lineTo(-4, -30);
            ctx.lineTo(-12, -35);
            ctx.closePath();
            ctx.fill();

            // Ring handle
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();
    }

    // Spawn New Target
    function spawnTarget() {
        if (!isGameRunning) return;
        targets.push(new Target());
        const interval = DIFFICULTY_SETTINGS[currentDifficulty].spawnInterval;
        spawnTimeout = setTimeout(spawnTarget, interval);
    }

    // Handle Shooting Action
    function shoot(e) {
        if (!isGameRunning) return;

        initAudio();
        totalShots++;

        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        const weaponOriginX = canvas.width / 2;
        const weaponOriginY = canvas.height - 60;

        // Apply recoil trigger animation
        gunOffset.recoil = 25;

        // Trigger Weapon Sound FX
        const weaponId = playerData.equippedWeapon;
        if (weaponId === 'pistol') playSound('shot_pistol');
        else if (weaponId === 'shotgun') playSound('shot_shotgun');
        else if (weaponId === 'laser') playSound('shot_laser');
        else if (weaponId === 'shuriken') playSound('throw_shuriken');
        else if (weaponId === 'kunai') playSound('throw_kunai');

        let hitTargetRef = null;

        // Target hit detection
        for (let i = targets.length - 1; i >= 0; i--) {
            const t = targets[i];
            const dist = Math.hypot(clickX - t.x, clickY - t.y);

            // Shotgun hit radius allowance
            const effectiveHitRadius = weaponId === 'shotgun' ? t.radius + 15 : t.radius;

            if (dist <= effectiveHitRadius && !t.isHit) {
                totalHits++;
                t.isHit = true;
                hitTargetRef = t;

                // Accuracy bonus calculation based on center distance
                const accuracyRatio = Math.max(0, 1 - (dist / t.radius));
                let basePoints = Math.round(10 + accuracyRatio * 15);
                if (t.isGold) basePoints *= 2;

                score += basePoints;

                // Hit Sound
                playSound(t.isGold ? 'hit_gold' : 'hit');

                // Visual explosion effects
                const particleColor = t.isGold ? '#fbbf24' : '#f87171';
                for (let p = 0; p < 16; p++) {
                    particles.push(new Particle(t.x, t.y, particleColor));
                }
                shockwaves.push(new Shockwave(t.x, t.y, particleColor));
                floatingTexts.push(new FloatingText(t.x, t.y - 10, `+${basePoints}`, t.isGold ? '#fbbf24' : '#34d399'));
                hitmarkers.push(new Hitmarker(clickX, clickY, true));
                break; // One target per shot
            }
        }

        if (!hitTargetRef) {
            hitmarkers.push(new Hitmarker(clickX, clickY, false));
        }

        // Spawn flying projectile / laser beam according to weapon type
        if (weaponId === 'laser') {
            laserBeams.push(new LaserBeam(weaponOriginX, weaponOriginY, clickX, clickY));
        } else if (weaponId === 'shuriken' || weaponId === 'kunai') {
            projectiles.push(new FlyingProjectile(weaponOriginX, weaponOriginY, clickX, clickY, weaponId, hitTargetRef));
        } else {
            // Pistol / Shotgun bullets
            muzzleFlashes.push(new MuzzleFlash(weaponOriginX, weaponOriginY, Math.atan2(clickY - weaponOriginY, clickX - weaponOriginX) + Math.PI / 2));
            if (weaponId === 'shotgun') {
                // Spread shotgun pellets
                for (let s = -2; s <= 2; s++) {
                    projectiles.push(new FlyingProjectile(weaponOriginX, weaponOriginY, clickX + s * 15, clickY + s * 10, 'bullet', hitTargetRef));
                }
            } else {
                projectiles.push(new FlyingProjectile(weaponOriginX, weaponOriginY, clickX, clickY, 'bullet', hitTargetRef));
            }
        }

        updateStatsUI();
    }

    function updateStatsUI() {
        scoreDisplay.textContent = score;
        const acc = totalShots > 0 ? Math.round((totalHits / totalShots) * 100) : 100;
        accuracyDisplay.textContent = `${acc}%`;
    }

    // Main Game Loop
    function gameLoop() {
        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render environment
        drawMapBackground();

        // Render & Update active targets
        targets = targets.filter(t => t.draw());

        // Render & Update flying projectiles (bullets, shurikens, kunai)
        projectiles.forEach((p, index) => {
            p.update();
            p.draw();
            if (!p.active) projectiles.splice(index, 1);
        });

        // Render & Update laser beams
        laserBeams.forEach((l, index) => {
            l.update();
            l.draw();
            if (l.alpha <= 0) laserBeams.splice(index, 1);
        });

        // Render & Update muzzle flashes
        muzzleFlashes.forEach((mf, index) => {
            mf.update();
            mf.draw();
            if (mf.alpha <= 0) muzzleFlashes.splice(index, 1);
        });

        // Render & Update particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.alpha <= 0) particles.splice(index, 1);
        });

        // Render & Update shockwaves
        shockwaves.forEach((s, index) => {
            s.update();
            s.draw();
            if (s.alpha <= 0) shockwaves.splice(index, 1);
        });

        // Render & Update floating texts
        floatingTexts.forEach((ft, index) => {
            ft.update();
            ft.draw();
            if (ft.alpha <= 0) floatingTexts.splice(index, 1);
        });

        // Render & Update hitmarkers
        hitmarkers.forEach((hm, index) => {
            hm.update();
            hm.draw();
            if (hm.alpha <= 0) hitmarkers.splice(index, 1);
        });

        // Render Equipped Weapon
        drawEquippedWeapon();

        if (isGameRunning) {
            requestAnimationFrame(gameLoop);
        }
    }

    // Start Game
    function startGame() {
        initAudio();
        isGameRunning = true;
        score = 0;
        totalShots = 0;
        totalHits = 0;
        timeLeft = 30;
        targets = [];
        particles = [];
        shockwaves = [];
        floatingTexts = [];
        hitmarkers = [];
        projectiles = [];
        laserBeams = [];
        muzzleFlashes = [];

        updateStatsUI();
        timerDisplay.textContent = `${timeLeft}s`;
        overlay.classList.add('hidden');

        // Start timer interval
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = `${timeLeft}s`;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        // Start Spawning targets
        clearTimeout(spawnTimeout);
        spawnTarget();

        // Start Animation loop
        requestAnimationFrame(gameLoop);
    }

    // End Game & Award Cash
    function endGame() {
        isGameRunning = false;
        clearInterval(timerInterval);
        clearTimeout(spawnTimeout);

        // Convert score to earned money
        const earnedMoney = Math.floor(score * 0.8);
        playerData.money += earnedMoney;
        saveData();
        updateEconomyUI();

        // UI Overlay presentation
        overlayTitle.textContent = 'ИГРА ОКОНЧАНА!';
        overlayIcon.textContent = '🏆';
        const acc = totalShots > 0 ? Math.round((totalHits / totalShots) * 100) : 100;
        overlayDesc.innerHTML = `Счет: <span class="text-emerald-400 font-bold">${score}</span> | Точность: <span class="text-cyan-400 font-bold">${acc}%</span><br>Заработано: <span class="text-amber-400 font-bold">+$${earnedMoney}</span>`;
        startBtn.textContent = '🔄 ИГРАТЬ СНОВА';

        overlay.classList.remove('hidden');
    }

                        <div class="text-[10px] text-slate-400">${w.desc}</div>

        Object.values(MAPS).forEach(m => {
            const isEquipped = playerData.equippedMap === m.id;
            const div = document.createElement('div');
            div.className = `p-3 rounded-2xl border transition-all flex items-center justify-between ${
                isEquipped ? 'bg-emerald-900/40 border-emerald-500' : 'bg-slate-800/60 border-slate-700/60'
            }`;

            let actionBtn = '';
            if (m.unlocked) {
                actionBtn = isEquipped 
                    ? `<span class="text-xs font-bold text-emerald-400 px-3 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-500/30">Выбрано</span>`
                    : `<button onclick="equipMap('${m.id}')" class="text-xs font-bold text-white px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600">Выбрать</button>`;
            } else {
                const canAfford = playerData.money >= m.price;
                actionBtn = `<button onclick="buyMap('${m.id}')" ${!canAfford ? 'disabled' : ''} class="text-xs font-bold px-3 py-1.5 rounded-xl ${
                    canAfford ? 'bg-amber-500 hover:bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-500 border border-slate-700'
                }">Купить $${m.price}</button>`;
            }

            div.innerHTML = `
                <div class="flex items-center space-x-3">
                    <span class="text-3xl">${m.icon}</span>
                    <div>
                        <div class="font-bold text-xs text-white">${m.name}</div>
                    </div>
                </div>
                ${actionBtn}
            `;
            shopMapsContainer.appendChild(div);
        });
    }

    // Shop Action Handlers
    window.buyWeapon = function(id) {
        const w = WEAPONS[id];
        if (playerData.money >= w.price) {
            playerData.money -= w.price;
            w.unlocked = true;
            playerData.unlockedWeapons.push(id);
            playerData.equippedWeapon = id;
            saveData();
            updateEconomyUI();
            renderShop();
        }
    };

    window.equipWeapon = function(id) {
        playerData.equippedWeapon = id;
        saveData();
        updateEconomyUI();
        renderShop();
    };

    window.buyMap = function(id) {
        const m = MAPS[id];
        if (playerData.money >= m.price) {
            playerData.money -= m.price;
            m.unlocked = true;
            playerData.unlockedMaps.push(id);
            playerData.equippedMap = id;
            saveData();
            updateEconomyUI();
            renderShop();
        }
    };

    window.equipMap = function(id) {
        playerData.equippedMap = id;
        saveData();
        updateEconomyUI();
        renderShop();
    };

    // UI Event Listeners
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mousePos.x = e.clientX - rect.left;
        mousePos.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', shoot);

    startBtn.addEventListener('click', startGame);

    // Difficulty selection handlers
    document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.difficulty-btn').forEach(b => {
                b.className = 'difficulty-btn border-2 border-slate-700 bg-slate-800 text-slate-300 p-2 rounded-xl text-left transition-all hover:border-slate-500';
            });
            btn.className = 'difficulty-btn border-2 border-indigo-500 bg-indigo-500/20 text-white p-2 rounded-xl text-left transition-all';
            currentDifficulty = btn.dataset.level;
        });
    });

    // Tab Navigation
    tabGame.addEventListener('click', () => {
        tabGame.className = 'flex-1 py-2 rounded-lg bg-indigo-600 text-white transition-all';
        tabShop.className = 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all flex justify-center items-center gap-1.5';
        panelGame.classList.remove('hidden');
        panelShop.classList.add('hidden');
    });

    tabShop.addEventListener('click', () => {
        tabShop.className = 'flex-1 py-2 rounded-lg bg-indigo-600 text-white transition-all flex justify-center items-center gap-1.5';
        tabGame.className = 'flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition-all';
        panelShop.classList.remove('hidden');
        panelGame.classList.add('hidden');
        renderShop();
    });

    shopSubtabWeapons.addEventListener('click', () => {
        shopSubtabWeapons.className = 'text-indigo-400 border-b-2 border-indigo-400 pb-1';
        shopSubtabMaps.className = 'hover:text-white pb-1';
        shopWeaponsContainer.classList.remove('hidden');
        shopMapsContainer.classList.add('hidden');
    });

    shopSubtabMaps.addEventListener('click', () => {
        shopSubtabMaps.className = 'text-emerald-400 border-b-2 border-emerald-400 pb-1';
        shopSubtabWeapons.className = 'hover:text-white pb-1';
        shopMapsContainer.classList.remove('hidden');
        shopWeaponsContainer.classList.add('hidden');
    });

    // Initialize Game Canvas & Data on Load
    window.onload = () => {
        resizeCanvas();
        loadData();
        drawMapBackground();
        drawEquippedWeapon();
    };
</script>
</body>
</html>
